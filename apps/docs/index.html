<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="sigilkit: a composable 2D adventure engine for React, in the spirit of SCUMM. Painted rooms, point-and-click verbs, Ink for story." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>sigilkit · a composable adventure engine for React</title>
    <script>
      // Apply the saved theme before first paint, so pages don't flash.
      try {
        const theme = localStorage.getItem("sigilkit-docs-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
