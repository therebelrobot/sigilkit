name: release

# Publishes every public workspace package when a v* tag is pushed
# (npm run release:patch|minor|major creates and pushes one).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance; no NPM_TOKEN secret

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tag must match the package version, or npm would publish something else.
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/sigilkit/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/sigilkit version $version"
            exit 1
          fi
      - run: npm publish -w sigilkit --access public --provenance
